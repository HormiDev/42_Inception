server {
    # Escucha en el puerto 443 con SSL para IPv4 e IPv6
    listen 443 ssl;
    listen [::]:443 ssl;

    # El server_name tiene que ser tu login para el proyecto Inception
    server_name ide-dieg.42.fr;

    # Protocolos de seguridad exigidos por Inception (TLS 1.2 y 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;

    # Si alguien manda HTTP simple al puerto HTTPS, Nginx usa el codigo interno
    # 497. Lo redirigimos a la misma URL pero usando https://.
    error_page 497 https://$host$request_uri;

    # Rutas a los certificados (debes generarlos en un script 'tools/setup.sh' o en el Dockerfile)
    ssl_certificate /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;

    # Directorio raíz donde estarán tus archivos web / de WordPress
    root /usr/share/nginx/html;
    index index.php index.html index.htm;

    # Configuración para las peticiones normales
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Bloque necesario para procesar PHP a través del contenedor WordPress (PHP-FPM)
    location ~ \.php$ {
        # Si la petición es PHP, se reenvía al contenedor "wordpress" en el puerto 9000
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
