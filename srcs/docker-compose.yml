services:
  nginx:
    build:
      context: ./requirements/nginx
    image: inception-nginx
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/usr/share/nginx/html
    depends_on:
      - wordpress
    networks:
      - inception
    restart: on-failure

  wordpress:
    build:
      context: ./requirements/wordpress
    image: inception-wordpress
    container_name: wordpress
    environment:
      # Compose lee estos valores desde srcs/.env.
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_URL: ${WORDPRESS_URL}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      WP_CREDENTIALS_FILE: /run/secrets/credentials
    secrets:
      - db_password
      - credentials
    expose:
      - "9000"
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - mariadb
    networks:
      - inception
    restart: on-failure

  mariadb:
    build:
      context: ./requirements/mariadb
    image: inception-mariadb
    container_name: mariadb
    environment:
      # MariaDB crea la base y el usuario definidos en srcs/.env.
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_password
      - db_root_password
    expose:
      - "3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    restart: on-failure

volumes:
  wordpress_data:
    name: wordpress_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ide-dieg/data/wordpress
  mariadb_data:
    name: mariadb_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ide-dieg/data/mariadb

networks:
  inception:
    name: inception
    driver: bridge

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt
